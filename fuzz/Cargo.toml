# cargo-fuzz manifest for the oxideav-mp3 Layer III attacker surface —
# decode, demux, AND encode.
#
# Started as the round-289 depth-mode decode lane (targets 1-2), the
# r405 demuxer lane (target 3), and extended in r432 to the encode
# loop and an encode→decode roundtrip invariant (targets 4-5), with
# the decode-side targets widened to the MPEG-2.5 and free-format
# paths that had landed in the library since r289.
#
# Spec basis for the targets: ISO/IEC 11172-3 §2.4.1.7 (side
# information), §2.4.2.7 (Huffman code-bit decoding of big_values +
# count1), §2.4.3.4 (requantisation, alias reduction, IMDCT, synthesis
# polyphase filterbank), §C.1.5 (encode procedure); ISO/IEC 13818-3
# §2.4.3.2 (LSF frames). The harness drives the registered `Decoder` /
# `Encoder` trait objects, the per-granule decode primitives
# (`parse_side_info`, `decode_scalefactors`, `decode_huffman`,
# `requantize`, `alias_reduce`, `imdct_granule`, `synth_granule`), the
# `Mp3Demuxer` container surface, and the `Mp3Encoder` stream API with
# attacker-supplied bytes; the contract under test is panic-freedom on
# every entry irrespective of input shape (plus the semantic roundtrip
# invariant of target 5).

[package]
name = "oxideav-mp3-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"

[dependencies.oxideav-mp3]
path = ".."

# Self-contained workspace so the umbrella's `crates/*` member glob
# (one level deep — this manifest is two levels deep and would not
# match anyway) cannot pull this package in.
[workspace]
members = ["."]

[profile.release]
debug = 1

# ------------------------------------------------------------------
# Fuzz targets.
# ------------------------------------------------------------------

# Target 1 — `decode`. Drives attacker-controlled bytes through
# `Decoder::send_packet` on a freshly registered MP3 decoder. The
# input is split into a sequence of variable-length packets so the
# cross-packet bit-reservoir state machine (`main_data_begin`
# lookback, reservoir assembly, IMDCT / synthesis overlap carry-over)
# is exercised across a mixed sequence of frames. Each packet is built
# with a structurally-valid 4-byte header (so the deep decode chain is
# actually reached) whose every field is attacker-chosen, then padded
# with attacker bytes for the CRC / side-info / main-data slot. Also
# exercises `flush()`, `reset()`, and a forced double-flush so the
# post-flush `Eof` path is covered.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

# Target 2 — `granule`. Structured adversarial fuzzer for the
# per-granule decode primitives below the trait surface. Constructs a
# structurally-valid header + side-info block, then drives the deep
# chain directly: `parse_side_info` → `decode_scalefactors` →
# `decode_huffman` (big_values region split + count1 quad decode) →
# `requantize` (power-3/4 dequant, scalefactor application) →
# `alias_reduce` → `imdct_granule` (long / short / mixed window
# overlap-add) → `synth_granule` (32-band polyphase filterbank). These
# primitives are reached by the trait target only once the reservoir
# lookback is satisfiable; this target feeds them attacker bytes
# directly so the deep dequant / overlap math is stressed on every
# iteration regardless of reservoir state.
[[bin]]
name = "granule"
path = "fuzz_targets/granule.rs"
test = false
doc = false

# Target 3 — `demux`. Drives attacker-controlled bytes through the
# `Mp3Demuxer` container surface: open (ID3v2 skip, Xing / Info /
# VBRI / LAME parse, free-format length measurement), bounded
# next_packet drains, the metadata accessors, and a seek schedule
# (front / interior / far-past-EOF) exercising the TOC and
# proportional seek paths plus the post-seek exact-PTS recount.
# Panic-freedom contract, same as the other targets.
[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false
bench = false

# Target 4 — `encode` (r432). Adversarial fuzzer for the encode loop:
# hostile PCM geometries (zero / odd / single-sample / multi-frame
# chunk schedules), extreme bitrate / sample-rate / channel-mode
# configurations (off-ladder and off-table values included), and the
# full toggle surface (VBR windows, CRC, Xing/Info emission, forced
# short / mixed blocks, auto block-typing with non-finite thresholds,
# intensity-stereo arming) across both the `oxideav_core::Encoder`
# trait path (with inconsistent AudioFrame plane/length geometry) and
# the direct `Mp3Encoder` stream API. Panic-freedom contract.
[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

# Target 5 — `roundtrip` (r432). Semantic encode → decode invariant:
# every stream the encoder emits under a valid configuration (all nine
# sample rates, ladder bitrates, mono/stereo/dual/MS-joint, CRC, VBR,
# Xing, forced-short, auto block-typing where supported) must
# frame-walk back losslessly, decode through this crate's own Decoder
# without error, and cover the pushed PCM sample count (tail-flush
# zero-padding). Violations panic and are reported as findings.
[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
