name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Splits the
# 30-minute total budget across the 3 targets (~10 min each). The
# ffmpeg oracle harness `dlopen`s libavcodec at runtime via libloading;
# the CI runner needs `ffmpeg` (which pulls libavcodec) for the oracle
# to actually validate instead of silently skipping.

on:
  schedule:
    - cron: "27 6 * * *"   # daily 06:27 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      extra_packages_apt: "ffmpeg"
      time_budget_seconds: 1800
    secrets: inherit
